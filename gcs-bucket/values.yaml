# GCP Cloud Storage Bucket service: static configuration, not shown in the UI.
#
# Every key is optional and wins over the other two sources:
#   1. this file
#   2. the cloud-providers provider of the NRN (.project.id, .services.region,
#      .services.tfstate.bucket)
#   3. the worker environment ($SERVICES_GCP_PROJECT or $GOOGLE_CLOUD_PROJECT,
#      $SERVICES_GCP_REGION, $SERVICES_TFSTATE_BUCKET)
#
# $VALUES is a file path in the scripts; read it with yaml_value, never jq.
# Never put a secret here.

# project_id: project the buckets live in.
# location: bucket location, a region (us-east1) or a multi-region (US).
# tfstate_bucket: an EXISTING bucket; this service writes under gcs-bucket/<service_id>/.
project_id: ""
location: ""
tfstate_bucket: ""

# Identity the linked apps run as (Workload Identity). Defaults to the
# Containers scope's: namespace nullplatform, service account default.
app_k8s_namespace: ""
app_k8s_service_account: ""
